name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore HumanLoopLab.sln
      - name: Build
        run: dotnet build HumanLoopLab.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test HumanLoopLab.sln --no-build --configuration Release
